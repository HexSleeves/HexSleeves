name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tailscale-mcp pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=tailscale-mcp&show_owner=false&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/pin-tailscale-mcp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate inkwell pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=inkwell&show_owner=false&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/pin-inkwell.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dvr pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=dvr&show_owner=false&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/pin-dvr.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skills pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=skills&show_owner=false&theme=transparent&hide_border=true&title_color=8B5CC7&icon_color=C9971C&text_color=7D8F89
          path: profile/pin-skills.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
