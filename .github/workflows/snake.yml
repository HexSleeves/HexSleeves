name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6B3FA0&color_dots=#e3e8e4,#c3d9c9,#8fbf9f,#4f8f68,#2f6b4f
            dist/snake-dark.svg?color_snake=#F2C14E&color_dots=#1a3135,#24513f,#3c7a57,#5ea377,#8fd19e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
